spring:
  application:
    name: validador
  main:
    # La Lambda no es un servidor: no debe intentar arrancar Tomcat ni el ciclo
    # de vida de una aplicacion web.
    web-application-type: none
    banner-mode: "off"

app:
  security:
    jwt:
      providers:
        # ---------------------------------------------------------------------
        # Microsoft Entra ID (Azure AD) - tenant del curso, tokens v1.0
        # ---------------------------------------------------------------------
        # OJO v1 vs v2: este tenant emite tokens version "1.0", cuyo emisor es
        # https://sts.windows.net/<tenant>/  (CON barra final) y cuyo JWK Set
        # esta en https://login.microsoftonline.com/<tenant>/discovery/keys.
        # El material de clase traia los valores v2.0
        # (login.microsoftonline.com/<tenant>/v2.0) porque ese es el ejemplo
        # generico; con ellos NINGUN token real de este tenant valida.
        #
        # Los valores no son secretos: son identificadores publicos del tenant e
        # iguales a los que lleva el frontend en environment.ts.
        - name: azure
          jwk-set-uri: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/discovery/keys
          issuers:
            - https://sts.windows.net/e5372bf0-c5e3-4286-887c-79069f209c1f/
          # Azure usa el Application ID URI como "aud". Se declaran las dos
          # formas en que puede llegar: con y sin el prefijo "api://".
          audiences:
            - api://446c57cb-aba2-4b7a-ab01-6f2e6af7d35c
            - 446c57cb-aba2-4b7a-ab01-6f2e6af7d35c

        # ---------------------------------------------------------------------
        # AWS Cognito - user pool de la segunda via de login
        # ---------------------------------------------------------------------
        # El frontend de Cognito manda el ID token (trae el claim "email" que
        # ms-carrito necesita para notificar la compra), pero el adaptador de
        # abajo acepta igualmente el ACCESS token porque valida "aud" O
        # "client_id": en Cognito el ID token lleva la audiencia en "aud" y el
        # ACCESS token en "client_id", por diseno, para que uno no se pueda usar
        # donde se espera el otro.
        - name: cognito
          jwk-set-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_AU4jqskhP/.well-known/jwks.json
          issuers:
            - https://cognito-idp.us-east-1.amazonaws.com/us-east-1_AU4jqskhP
          # App Client ID del user pool.
          audiences:
            - 5ikmrldrcrkejq5d4v6bqcjo8f
        #
        # No se declara ningun rol por defecto: este authorizer solo comprueba
        # que el token sea valido. Quien decide sobre roles y scopes es el
        # backend (ms-productos y ms-carrito), que vuelve a validar el token.

logging:
  level:
    # Autorizacion: un nivel bajo es un riesgo, no solo ruido.
    org.springframework.security: INFO
    com.lambda.validador: INFO
    # AWSLambdaUtils registra el evento ENTERO en INFO, y el evento del authorizer
    # lleva el token en claro dos veces: en "identitySource" y en
    # "headers.authorization". Con este nivel, cada peticion deja un JWT
    # reutilizable escrito en CloudWatch Logs.
    org.springframework.cloud.function: WARN
